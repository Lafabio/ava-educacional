[project]
name = 'ava-educacional'
version = '1.0.0'
description = 'SaaS Educacional 100% Python com Supabase e Vercel'
requires-python = '>=3.12'
dependencies = [
    'fastapi>=0.117.1',
    'uvicorn>=0.30.0',
    'jinja2>=3.1.0',
    'supabase>=2.9.0',
    'sqlalchemy>=2.0.0',
    'pydantic>=2.0.0',
    'python-multipart',
    'python-dotenv',
    'httpx',
    'aiofiles'
]

[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[tool.vercel]
entrypoint = 'app:app'
