{% extends 'base.html' %}
{% block title %}Meus Cursos{% endblock %}
{% block content %}
<div class='flex gap-4'>
    <div class='w-64 bg-white p-4 rounded-lg shadow'>
        <h3 class='font-bold mb-4'>Navegação</h3>
        <ul>
            <li class='mb-2'><a href='/dashboard' class='text-blue-600'>Dashboard</a></li>
            <li class='mb-2'><a href='/courses' class='text-blue-600 font-bold'>Meus Cursos</a></li>
            <li class='mb-2'><a href='/assessments' class='text-blue-600'>Avaliações</a></li>
        </ul>
    </div>
    <div class='flex-1'>
        <div class='flex justify-between items-center mb-4'>
            <h2 class='text-2xl font-bold'>Meus Cursos</h2>
            <button onclick="document.getElementById('modal-novo-curso').classList.remove('hidden')" class='bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700'>+ Novo Curso</button>
        </div>
        <div id='courses-container' class='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4'>
            <p class='text-gray-500'>Carregando cursos...</p>
        </div>
        <div id='empty-state' class='hidden text-center py-10'>
            <p class='text-gray-500 text-lg'>Nenhum curso encontrado</p>
            <p class='text-gray-400'>Crie seu primeiro curso clicando no botão acima</p>
        </div>
    </div>
</div>

<div id='modal-novo-curso' class='hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50'>
    <div class='bg-white p-6 rounded-lg shadow-lg w-96'>
        <h3 class='text-xl font-bold mb-4'>Novo Curso</h3>
        <form id='form-novo-curso'>
            <div class='mb-4'>
                <label class='block text-gray-700'>Título</label>
                <input type='text' id='curso-titulo' class='w-full p-2 border rounded' required>
            </div>
            <div class='mb-4'>
                <label class='block text-gray-700'>Descrição</label>
                <textarea id='curso-descricao' class='w-full p-2 border rounded' rows='3'></textarea>
            </div>
            <div class='flex justify-end gap-2'>
                <button type='button' onclick="document.getElementById('modal-novo-curso').classList.add('hidden')" class='px-4 py-2 border rounded'>Cancelar</button>
                <button type='submit' class='px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700'>Criar</button>
            </div>
        </form>
    </div>
</div>

<script>
function loadCourses() {
    fetch('/api/courses').then(r=>r.json()).then(d => {
        const container = document.getElementById('courses-container');
        const empty = document.getElementById('empty-state');
        if(d.courses.length === 0) {
            container.classList.add('hidden');
            empty.classList.remove('hidden');
        } else {
            empty.classList.add('hidden');
            container.classList.remove('hidden');
            container.innerHTML = d.courses.map(c => `
                <div class='bg-white p-4 rounded-lg shadow hover:shadow-lg transition'>
                    <h3 class='font-bold text-lg mb-2'>${c.title || 'Sem título'}</h3>
                    <p class='text-gray-600 text-sm mb-4'>${c.description || 'Sem descrição'}</p>
                    <div class='flex justify-between items-center text-sm text-gray-500'>
                        <span>${c.profiles ? c.profiles.full_name : 'Professor'}</span>
                        <span>${new Date(c.created_at).toLocaleDateString('pt-BR')}</span>
                    </div>
                    <a href='/course/${c.id}' class='block mt-4 text-center bg-blue-100 text-blue-600 py-2 rounded hover:bg-blue-200'>Ver Detalhes</a>
                </div>
            `).join('');
        }
    });
}

document.getElementById('form-novo-curso').onsubmit = function(e) {
    e.preventDefault();
    const formData = new FormData();
    formData.append('title', document.getElementById('curso-titulo').value);
    formData.append('description', document.getElementById('curso-descricao').value);
    fetch('/api/courses', {
        method: 'POST',
        body: formData
    }).then(r => {
        if(r.redirected) {
            window.location.href = r.url;
        } else {
            loadCourses();
        }
        document.getElementById('modal-novo-curso').classList.add('hidden');
        document.getElementById('form-novo-curso').reset();
    }).catch(() => {
        loadCourses();
    });
}

loadCourses();
</script>
{% endblock %}
