{% extends 'base.html' %}
{% block title %}Redefinir Senha{% endblock %}
{% block content %}
<div class='max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg'>
    <h2 class='text-2xl font-bold text-center mb-6'>Redefinir Senha</h2>
    <p class='text-gray-600 text-center mb-6'>Informe seu email para receber o link de redefinição de senha.</p>
    <form method='POST' action='/api/auth/forgot-password'>
        <div class='mb-4'>
            <label class='block text-gray-700'>Email</label>
            <input type='email' name='email' class='w-full p-2 border rounded' required placeholder='seu@email.com'>
        </div>
        <button type='submit' class='w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700'>Enviar Link de Redefinição</button>
    </form>
    <p class='text-center mt-4'>
        <a href='/login' class='text-blue-600 hover:underline'>Voltar ao Login</a>
    </p>
</div>
{% endblock %}
