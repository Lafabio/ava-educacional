{% extends 'base.html' %}
{% block title %}Minhas Matrículas{% endblock %}
{% block content %}
<div class='max-w-6xl mx-auto'>
    <h1 class='text-3xl font-bold mb-6'>Minhas Matrículas</h1>

    <div id='enrollments-container' class='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6'>
        <p class='text-gray-500'>Carregando...</p>
    </div>
    <div id='empty-state' class='hidden text-center py-10'>
        <i class='fas fa-graduation-cap text-6xl text-gray-300 mb-4'></i>
        <p class='text-gray-500 text-lg mb-4'>Você ainda não está matriculado em nenhum curso</p>
        <a href='/catalog' class='bg-blue-600 text-white px-6 py-3 rounded-lg inline-block hover:bg-blue-700'>
            <i class='fas fa-search mr-1'></i> Explorar Cursos
        </a>
    </div>
</div>

<script>
fetch('/api/my-enrollments').then(r=>r.json()).then(d => {
    const container = document.getElementById('enrollments-container');
    const empty = document.getElementById('empty-state');
    if(!d.enrollments || d.enrollments.length === 0) {
        container.classList.add('hidden');
        empty.classList.remove('hidden');
    } else {
        empty.classList.add('hidden');
        container.classList.remove('hidden');
        container.innerHTML = d.enrollments.map(e => {
            const course = e.courses || {};
            const statusColor = e.status === 'active' ? 'green' : e.status === 'completed' ? 'blue' : 'gray';
            return `
            <div class='bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition'>
                <div class='flex items-center justify-between mb-3'>
                    <span class='text-sm text-gray-500'><i class='fas fa-book mr-1'></i>${course.title || 'Curso'}</span>
                    <span class='text-xs px-2 py-1 rounded bg-${statusColor}-100 text-${statusColor}-600'>${e.status === 'active' ? 'Ativo' : e.status === 'completed' ? 'Concluído' : 'Inativo'}</span>
                </div>
                <h3 class='font-bold text-xl mb-2'>${course.title || 'Sem título'}</h3>
                <p class='text-gray-600 text-sm mb-4'>${course.description || 'Sem descrição'}</p>
                <div class='text-sm text-gray-500 mb-4'>
                    <span><i class='fas fa-calendar mr-1'></i>Matriculado em: ${new Date(e.enrolled_at).toLocaleDateString('pt-BR')}</span>
                </div>
                <a href='/course/${course.id}' class='block w-full text-center bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-semibold'>
                    <i class='fas fa-play-circle mr-2'></i> Acessar Curso
                </a>
            </div>`;
        }).join('');
    }
});
</script>
{% endblock %}
