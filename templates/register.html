{% extends 'base.html' %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class='max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg'>
    <h2 class='text-2xl font-bold text-center mb-6'>Criar Conta no AVA</h2>
    <form method='POST' action='/api/auth/signup'>
        <div class='mb-4'>
            <label class='block text-gray-700'>Nome Completo</label>
            <input type='text' name='full_name' class='w-full p-2 border rounded' required>
        </div>
        <div class='mb-4'>
            <label class='block text-gray-700'>Email</label>
            <input type='email' name='email' class='w-full p-2 border rounded' required>
        </div>
        <div class='mb-4'>
            <label class='block text-gray-700'>Senha</label>
            <input type='password' name='password' class='w-full p-2 border rounded' required minlength='6'>
        </div>
        <button type='submit' class='w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700'>Cadastrar</button>
    </form>
    <p class='text-center mt-4 text-gray-600'>Já tem conta? <a href='/login' class='text-blue-600'>Entrar</a></p>
</div>
{% endblock %}
